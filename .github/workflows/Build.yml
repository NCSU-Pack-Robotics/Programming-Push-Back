name: PROS Build
run-name: Building PROS Project

on:
  push:
  pull_request:

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      XPACK_ARM_GCC_VERSION: "14.2.1-1.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
            submodules: 'recursive'

      - name: Install Libusb
        run: sudo apt-get install pkg-config libusb-1.0-0-dev

      - name: Setup cmake
        run: cmake -S . -B build -DTESTING=1 -DTHINK=1 -DBRAIN=1 -DDO=0

      - name: Build
        run: cmake --build build --target TestSuite_Programming_Push_Back

      - name: Run GTest
        run: ./build/Push_Back/test/TestSuite_Programming_Push_Back

